<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login EdTech</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#e2e8f0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    width:400px;
    padding:40px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.demo{
    margin-top:20px;
    font-size:14px;
    color:#555;
}

#error{
    margin-top:10px;
    color:red;
    text-align:center;
}

</style>

</head>
<body>

<div class="login-box">

    <h2>🔐 Iniciar Sesión</h2>

    <input
        type="text"
        id="usuario"
        placeholder="Usuario">

    <input
        type="password"
        id="password"
        placeholder="Contraseña">

    <button onclick="login()">
        Ingresar
    </button>

    <div class="demo">
        <strong>Usuario demo:</strong> admin<br>
        <strong>Contraseña:</strong> 1234
    </div>

    <p id="error"></p>

</div>

<script>

function login(){

    let usuario =
        document.getElementById("usuario").value;

    let password =
        document.getElementById("password").value;

    if(usuario === "admin" && password === "1234"){

        window.location.href =
        "http://localhost:8082";

    }else{

        document.getElementById("error").innerText =
        "Usuario o contraseña incorrectos";

    }

}

</script>

</body>
</html>
