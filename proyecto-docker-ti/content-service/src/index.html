<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contenido</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

.curso{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.progress{
background:#ddd;
height:12px;
border-radius:10px;
margin-top:10px;
}

.bar{
height:12px;
background:#2563eb;
border-radius:10px;
}

</style>

</head>
<body>

<h1>🎥 Mis Cursos</h1>

<div class="curso">
<h3>Álgebra Lineal</h3>
<p>Progreso 70%</p>

<div class="progress">
<div class="bar" style="width:70%"></div>
</div>
</div>

<div class="curso">
<h3>Programación en C</h3>
<p>Progreso 45%</p>

<div class="progress">
<div class="bar" style="width:45%"></div>
</div>
</div>

<div class="curso">
<h3>Bases de Datos</h3>
<p>Progreso 60%</p>

<div class="progress">
<div class="bar" style="width:60%"></div>
</div>
</div>

</body>
</html>
