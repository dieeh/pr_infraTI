<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdTech Platform</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:50px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    text-align:center;
    width:500px;
}

h1{
    color:#1e293b;
    margin-bottom:15px;
}

p{
    color:#555;
    margin-bottom:30px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

</style>

</head>
<body>

<div class="container">

    <h1>🎓 EdTech Platform</h1>

    <p>
        Plataforma educativa basada en microservicios Docker.
    </p>

    <button onclick="ingresar()">
        Ingresar al Portal
    </button>

</div>

<script>

function ingresar(){
    window.location.href="http://localhost:8080";
}

</script>

</body>
</html>

</body>
</html>
